spring.application.name=tongpin-live
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=${PORT:18080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=7d
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/tongpin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}
app.public-origin=${APP_PUBLIC_ORIGIN:${RENDER_EXTERNAL_URL:http://localhost:5173}}
app.extra-origin=${APP_EXTRA_ORIGIN:}
app.environment=${APP_ENV:local}
spring.jackson.time-zone=Asia/Shanghai
