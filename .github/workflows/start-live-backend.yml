name: 启动直播服务

on:
  workflow_dispatch:

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 唤醒云端服务并检查状态
        run: >-
          curl --fail --silent --show-error
          --retry 4 --retry-delay 5 --retry-all-errors
          --connect-timeout 10 --max-time 60
          https://18080-agq4iihhd6ie55qjpl2ezecsrm.instabox.tech/api/system/status
