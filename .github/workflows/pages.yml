name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'live-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: live-web/package-lock.json
      - name: Build website
        working-directory: live-web
        env:
          VITE_PUBLIC_BASE: /zaichang-live/
          VITE_HASH_ROUTER: 'true'
          VITE_API_ORIGIN: https://18080-agq4iihhd6ie55qjpl2ezecsrm.instabox.tech
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live-web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
