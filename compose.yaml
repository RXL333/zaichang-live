name: tongpin-live
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tongpin
      POSTGRES_USER: tongpin
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tongpin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongpin -d tongpin"]
      interval: 5s
      timeout: 3s
      retries: 10
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1", "--udp-port", "7882"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
volumes:
  tongpin-postgres:
